name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */3 * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X HEAD "https://wftycbttpwxzizqgwatu.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"