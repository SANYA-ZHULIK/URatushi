<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление - У Ратуши</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="utils.js"></script>
    <script src="admin-panel.js"></script>
    <script src="admin-menu.js"></script>
</head>
<body id="admin-login-page">
    <div class="login-container" id="login-container">
        <h2>Вход в панель управления</h2>
        <form id="login-form" autocomplete="off">
            <div class="form-group">
                <label for="admin-email">Email</label>
                <input type="email" id="admin-email" autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="admin-password">Пароль</label>
                <input type="password" id="admin-password" autocomplete="off" required>
            </div>  
            <button type="submit" class="btn-primary">Войти</button>
        </form>
    </div>

    <div id="admin-panel" style="display: none;">
        <header class="admin-header">
            <div class="container header-inner">
                <a href="/" class="logo"><img src="logo.png" alt="У Ратуши">У Ратуши</a>
                <div class="admin-middle">
    <!-- Десктопная навигация -->
    <nav class="admin-nav">
        <ul>
            <li><a href="#" class="admin-nav-link active" data-tab="bookings-tab">Бронирования</a></li>
            <li><a href="#" class="admin-nav-link" data-tab="tables-tab">Столики</a></li>
            <li><a href="#" class="admin-nav-link" data-tab="menu-tab">Управление меню</a></li>
        </ul>
    </nav>

    <!-- Мобильная навигация (выпадающий список) -->
    <div class="admin-nav-mobile" id="admin-nav-mobile">
        <select id="mobile-nav-select" onchange="handleMobileNav(this.value)">
            <option value="bookings-tab">Бронирования</option>
            <option value="tables-tab">Столики</option>
            <option value="menu-tab">Управление меню</option>
            <option value="logout" class="logout-option">🚪 Выйти</option>
        </select>
    </div>
</div>
                <button id="logout-btn" class="btn-primary">Выйти</button>
            </div>
        </header>

        <div class="admin-content">
            <div class="container">

                <!-- Tab: Бронирования -->
                <div id="bookings-tab" class="tab-content active">
                    <div class="bookings-table-container">
                        <div class="bookings-header">
                            <h2>Бронирования</h2>
                            <button id="add-booking-btn" class="btn-primary">+ Добавить бронь</button>
                        </div>

                        <div class="bookings-filters">
                            <input type="text" id="search-input" placeholder="Поиск по имени, телефону..." style="width: 350px;">
                            <input type="date" id="filter-date">
                            <select id="filter-status">
                                <option value="">Все статусы</option>
                                <option value="new">Новые</option>
                                <option value="confirmed">Подтвержденные</option>
                                <option value="completed">Завершенные</option>
                                <option value="cancelled">Отмененные</option>
                            </select>
                            <button id="clear-filters">Сбросить</button>
                        </div>

                        <div class="bulk-actions">
                            <button id="select-all-btn">Все</button>
                            <button id="bulk-confirm-btn">Подтвердить</button>
                            <button id="bulk-cancel-btn">Отменить</button>
                        </div>

                        <table class="bookings-table">
                            <thead>
                                <tr>
                                    <th style="width: 40px;"><input type="checkbox" id="select-all-checkbox" class="booking-checkbox"></th>
                                    <th style="width: 50px;">ID</th>
                                    <th style="width: 70px;">Стол</th>
                                    <th style="width: 130px;">Имя</th>
                                    <th style="width: 110px;">Телефон</th>
                                    <th style="width: 80px;">Дата</th>
                                    <th style="width: 60px;">Время</th>
                                    <th style="width: 50px;">Гости</th>
                                    <th style="width: 120px;">Комментарий</th>
                                    <th style="width: 180px;">Статус</th>
                                    <th style="width: 130px;">Действия</th>
                                </tr>
                            </thead>
                            <tbody id="bookings-tbody"></tbody>
                        </table>
                    </div>
                    <!-- ========== МОБИЛЬНЫЙ СПИСОК БРОНИРОВАНИЙ ========== -->
<div class="mobile-bookings-list" id="mobile-bookings-list">
    <div class="mobile-bookings-header">
       
        <div class="mobile-bookings-header-actions">
            
            <button id="mobile-add-booking-btn" class="btn-primary" onclick="openAddBookingModal()">+</button>
            <button id="mobile-filter-toggle" class="mobile-filter-btn">Поиск</button>
        </div>
    </div>

    <!-- Мобильные фильтры (скрыты по умолчанию) -->
    <div class="mobile-bookings-filters" id="mobile-bookings-filters" style="display: none;">
        <input type="text" id="mobile-search-input" placeholder="Поиск по имени, телефону...">
        <input type="date" id="mobile-filter-date">
        <select id="mobile-filter-status">
            <option value="">Все статусы</option>
            <option value="new">Новые</option>
            <option value="confirmed">Подтверждённые</option>
            <option value="completed">Завершённые</option>
            <option value="cancelled">Отменённые</option>
        </select>
        <button id="mobile-clear-filters">Сбросить</button>
    </div>

    <!-- Карточки бронирований -->
    <div id="mobile-bookings-cards" class="mobile-bookings-cards"></div>
</div>
                </div>

                <!-- Tab: Столики -->
                <div id="tables-tab" class="tab-content">
                    <div class="tables-management">
                        <h3>Управление столиками</h3>
                        <div id="tables-list"></div>
                    </div>
                </div>

                <!-- Tab: Управление меню -->
                <div id="menu-tab" class="tab-content">
                    <div class="menu-controls">
                        <button id="add-dish-btn" class="btn-menu">Добавить блюдо</button>
                        <input type="text" id="menu-search" placeholder="Поиск по названию..." class="menu-search-input">
                        <select id="category-filter" class="category-filter">
                            <option value="Салаты">Салаты</option>
                            <option value="Супы">Супы</option>
                            <option value="Холодные закуски">Холодные закуски</option>
                            <option value="Закуски к пиву">Закуски к пиву</option>
                            <option value="Мясо и птица">Мясо и птица</option>
                            <option value="Рыба и морепродукты">Рыба и морепродукты</option>
                            <option value="Белорусская кухня">Белорусская кухня</option>
                            <option value="Гарниры">Гарниры</option>
                            <option value="Соусы">Соусы</option>
                            <option value="Десерты">Десерты</option>
                            <option value="Напитки">Напитки</option>
                        </select>
                    </div>

                    <div id="menu-list"></div>
                </div>

            </div>
        </div>
    </div>
    </div>

    <!-- Modal: Add Booking -->
    <div id="add-booking-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Добавить бронь</h3>
            <form id="add-booking-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="add-table">Столик</label>
                        <select id="add-table" required></select>
                    </div>
                    <div class="form-group">
                        <label for="add-date">Дата</label>
                        <input type="date" id="add-date" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="add-time">Время</label>
                        <select id="add-time" required></select>
                    </div>
                    <div class="form-group">
                        <label for="add-guests">Гости</label>
                        <select id="add-guests" required></select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="add-name">Имя клиента</label>
                    <input type="text" id="add-name" required>
                </div>
                <div class="form-group">
                    <label for="add-phone">Телефон</label>
                    <input type="tel" id="add-phone" required>
                </div>
                <div class="form-group">
                    <label for="add-comment">Комментарий</label>
                    <textarea id="add-comment" rows="2"></textarea>
                </div>
                <button type="submit" class="btn-primary">Добавить бронь</button>
            </form>
        </div>
    </div>

    <!-- Modal: Add/Edit Dish -->
    <div id="add-dish-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="cancelDishForm()">&times;</span>
            <h3 class="modal-title">Добавить блюдо</h3>
            <form id="add-dish-form">
                <div class="form-group">
                    <label for="dish-name">Название *</label>
                    <input type="text" id="dish-name" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="dish-category">Категория *</label>
                        <select id="dish-category" required>
                            <option value="">Выберите</option>
                            <option value="Салаты">Салаты</option>
                            <option value="Супы">Супы</option>
                            <option value="Холодные закуски">Холодные закуски</option>
                            <option value="Закуски к пиву">Закуски к пиву</option>
                            <option value="Мясо и птица">Мясо и птица</option>
                            <option value="Рыба и морепродукты">Рыба и морепродукты</option>
                            <option value="Белорусская кухня">Белорусская кухня</option>
                            <option value="Гарниры">Гарниры</option>
                            <option value="Соусы">Соусы</option>
                            <option value="Десерты">Десерты</option>
                            <option value="Напитки">Напитки</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="dish-price">Цена (руб) *</label>
                        <input type="number" id="dish-price" required min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label for="dish-description">Описание</label>
                    <textarea id="dish-description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Фото</label>
                    <div class="photo-upload-wrapper">
<div class="photo-preview" id="photo-preview">
    <img src="photo_/no_photo.jpg" alt="Preview">
</div>
                        <div>
                            <label for="dish-photo" class="file-input-label">Выбрать фото</label>
                            <input type="file" id="dish-photo" accept="image/*">
                            <span class="file-name-display" id="file-name-display"></span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="dish-is-active" checked>
                        <span>Активно (отображается в меню)</span>
                    </label>
                </div>
                <button type="submit" class="btn-primary">Сохранить</button>
            </form>
        </div>
    </div>
    <!-- Modal: Детали бронирования (мобильный) -->
<div id="booking-detail-modal" class="modal">
    <div class="modal-content" style="max-width: 480px;">
        <span class="close-modal" onclick="closeBookingDetail()">&times;</span>
        <h3 style="margin-bottom: 1.2rem; color: var(--primary);">Бронь №<span id="detail-id">—</span></h3>
        <div id="booking-detail-content"></div>
    </div>
</div>

</body>
</html>
